# Server-side stack (docs/deploy.md) — synced onto the VPS from this repo on every deploy
# (deploy/remote-deploy.sh), at /opt/ammari/docker-compose.yml. Only `caddy` publishes ports;
# `admin`/`web` are reachable only on the internal network, never directly from the internet —
# this, together with Caddy's own Cloudflare-origin-pull requirement (deploy/Caddyfile), is what
# makes trusting `cf-connecting-ip` in the apps' own rate limiting (packages/auth) safe
# (docs/plans/deploy-dev.md).
#
# Image tags come from /opt/ammari/.env (ADMIN_IMAGE_TAG, WEB_IMAGE_TAG) — rewritten by
# deploy/remote-deploy.sh on every deploy; rollback is just rewriting that file to an older SHA
# and re-running `docker compose up -d`.
#
# Log rotation is set here (not relying on a separate, easy-to-forget VPS daemon.json edit) —
# json-file with a small cap per container matters on a 2GB-RAM/disk-constrained box.
# Pinned so the compose project (and therefore its network/volume names, e.g. `ammari_internal`)
# is predictable regardless of which directory this file sits in or what the CWD was when
# `docker compose` ran it — deploy/remote-deploy.sh's health-check step relies on this name.
name: ammari

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ./caddy (Caddyfile + certs/) is mounted as ONE directory, not a single-file mount of the
      # Caddyfile — Session 10: a single-file bind mount binds to that file's INODE, not its
      # path, and rsync's default replace-via-rename (what every deploy's sync step does) swaps
      # the inode, leaving a single-file-mounted container serving stale content forever
      # (confirmed real on THIS environment — see docs/deploy.md's Caddy-reload section and
      # ./caddy/Caddyfile's own header comment for the full story). A directory mount doesn't
      # have this problem: the container always resolves a path against whatever the host
      # directory currently contains.
      - ./caddy:/etc/caddy:ro
      - ./cloudflare:/etc/caddy/cloudflare:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - admin
      - web

  admin:
    image: ghcr.io/tangguhriyadi/ammari-admin:${ADMIN_IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./env/admin.env
    networks:
      - internal

  web:
    image: ghcr.io/tangguhriyadi/ammari-web:${WEB_IMAGE_TAG}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./env/web.env
    networks:
      - internal

  # The internal cron service (docs/plans/cart-checkout.md §6.3, §11): the payment expiry sweep
  # every 5 minutes and the retention job daily, as authenticated POSTs straight to web:3000 on the
  # internal network (./cron/cron.sh explains it). No ports. The script directory is mounted whole
  # (not a single-file mount, for the same rsync-inode reason as ./caddy above), and
  # remote-deploy.sh recreates this container on every deploy so a changed script or env/cron.env
  # takes effect. env/cron.env holds only INTERNAL_CRON_SECRET (never web.env's other secrets);
  # remote-deploy.sh creates it empty if missing, and an empty secret just idles the loop.
  cron:
    image: curlimages/curl:8.22.0
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/opt/cron/cron.sh"]
    volumes:
      - ./cron:/opt/cron:ro
    env_file:
      - ./env/cron.env
    networks:
      - internal
    depends_on:
      - web

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
