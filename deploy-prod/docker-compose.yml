# Prod-environment stack (docs/deploy-prod.md, Session 7) — synced onto the PROD VPS from this
# repo on every deploy (deploy-prod/remote-deploy.sh, Session 3), at /opt/ammari-prod. Separate
# directory from deploy/ (dev) on purpose — see docs/plans/prod-deploy.md §2, "Config location"
# row — so the two environments' rsync targets can never cross-contaminate.
#
# Blue-green: admin and web each have two slots (…-blue / …-green). Only ONE slot per app is
# meant to be running at a time — deploy-prod/remote-deploy.sh (Session 3) is what actually
# starts/stops the right one (`docker compose up -d admin-blue`, not a bare `up -d`), waits for
# its own health check before flipping traffic, and stops the old slot only after the flip. The
# flip is SEQUENTIAL by default (admin flips fully before web starts, if both change in the same
# deploy) — the real VPS has ~3.0 GiB usable RAM, not the 4 GB this plan was originally sized
# against, so at most one app ever runs two slots at once; see docs/plans/prod-deploy.md §1
# "Memory budget" and §3 Session 3. This file does not use Compose `profiles:` to enforce any of
# that — the deploy script's explicit service selection is the enforcement.
#
# `caddy` deliberately has no `depends_on` on the app services (unlike deploy/docker-compose.yml
# in dev, which only ever has one slot per app): which slot is "active" changes at deploy time,
# not at container-start time. Caddy's upstream for each app is a small generated snippet
# (deploy-prod/caddy/active-upstream.caddy, Session 3) that remote-deploy.sh rewrites and
# `caddy reload`s on every slot flip — Caddy itself doesn't need to wait on either slot to start.
#
# Pinned so the compose project (and therefore its network name, e.g. `ammari-prod_internal`,
# referenced directly by remote-deploy.sh's migrator `docker run --network` call in Session 3) is
# predictable regardless of which directory this file sits in or what the CWD was when
# `docker compose` ran it.
name: ammari-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Heap cap for each admin/web container, below its own mem_limit — leaves headroom for Next.js's
# non-heap RSS (native deps, buffers) inside the same container cap. See
# docs/plans/prod-deploy.md §1 "Memory budget".
x-node-options: &node-memory
  NODE_OPTIONS: --max-old-space-size=320

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ./caddy (Caddyfile, certs/, the generated active-upstream snippet) is mounted as ONE
      # directory, not individual single-file mounts — Session 10: a single-file bind mount
      # binds to that file's INODE, not its path, and rsync's default replace-via-rename (what
      # every deploy's sync step does) swaps the inode, leaving a single-file-mounted container
      # serving stale content forever (confirmed real on dev — see docs/deploy-prod.md §12 and
      # ./caddy/Caddyfile's own header comment for the full story). A directory mount doesn't
      # have this problem: the container always resolves a path against whatever the host
      # directory currently contains. `cloudflare/` is a separate directory mount for the same
      # reason it always was — it was never single-file to begin with, just kept apart from
      # Caddy's own `caddy/` directory since prod's AOP CA root lives there and must stay
      # excluded from the routine deploy sync.
      - ./caddy:/etc/caddy:ro
      - ./cloudflare:/etc/caddy/cloudflare:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  db:
    # Must match the Postgres major version used in dev/local (16, docs/SPEC.md §2.4).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    # Conservative for a 3.6 GiB box (the actual provisioned VPS, not a 4 GB planning estimate)
    # shared with admin's and web's app containers — see docs/plans/prod-deploy.md §1 "Memory
    # budget". The blue-green flip is SEQUENTIAL by default (admin fully, then web), so at most
    # 3 Next.js containers run at once, never 4. Postgres's own defaults (128MB shared_buffers)
    # are too small for this workload; these are still well short of the usual "25% of RAM" rule
    # of thumb because RAM here is shared with those app containers, not dedicated to Postgres
    # the way a managed instance would be.
    command:
      - "-c"
      - "shared_buffers=192MB"
      - "-c"
      - "effective_cache_size=512MB"
    env_file:
      - ./env/db.env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  admin-blue:
    # `:-bootstrap` only silences Compose's "variable is not set" warning for whichever slot
    # hasn't been deployed to yet (remote-deploy.sh's set_image_tag_env only ever writes the
    # slot it's actually flipping to) — it never changes slot behaviour: `:bootstrap` is not a
    # real pushed tag, so this service simply can't be started until remote-deploy.sh writes a
    # real sha into .env for it, exactly as before.
    image: ghcr.io/tangguhriyadi/ammari-admin:${ADMIN_BLUE_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 450m
    environment: *node-memory
    env_file:
      - ./env/admin.env
    # Session 3 (deploy-prod/remote-deploy.sh) already waits for db to report healthy before
    # ever starting an app slot — this is defense in depth for the same guarantee, so a slot
    # started outside that script's own sequencing still refuses to come up against a db that
    # isn't ready yet, rather than crash-looping against connection errors.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  admin-green:
    image: ghcr.io/tangguhriyadi/ammari-admin:${ADMIN_GREEN_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 450m
    environment: *node-memory
    env_file:
      - ./env/admin.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web-blue:
    image: ghcr.io/tangguhriyadi/ammari-web:${WEB_BLUE_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 450m
    environment: *node-memory
    env_file:
      - ./env/web.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web-green:
    image: ghcr.io/tangguhriyadi/ammari-web:${WEB_GREEN_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 450m
    environment: *node-memory
    env_file:
      - ./env/web.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # The internal cron service (docs/plans/cart-checkout.md §6.3, §11): the payment expiry sweep
  # every 5 minutes and the retention job daily, as authenticated POSTs to http://web:3000, the
  # floating alias remote-deploy.sh's point_web_alias keeps on the active web slot (./cron/cron.sh
  # explains it). No ports, no depends_on (like caddy: which web slot is live changes at deploy
  # time). Started and recreated by remote-deploy.sh after the web flip. The script directory is
  # mounted whole (rsync-inode reason, see caddy above). env/cron.env holds only
  # INTERNAL_CRON_SECRET; remote-deploy.sh creates it empty if missing, and an empty secret just
  # idles the loop.
  cron:
    image: curlimages/curl:8.22.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 32m
    entrypoint: ["/bin/sh", "/opt/cron/cron.sh"]
    volumes:
      - ./cron:/opt/cron:ro
    env_file:
      - ./env/cron.env
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  db_data:
